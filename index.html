
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi sitio de prueba</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px 20px 60px;
      background: #f3f6fa;
      color: #243047;
    }
    .site-header {
      text-align: left;
      margin-bottom: 28px;
    }
    .logo {
      display: block;
      height: 64px;
      width: auto;
    }
    .card {
      max-width: 550px;
      margin: auto;
      padding: 35px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 20px #0001;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }
    button {
      background: #1769ff;
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 12px 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <img src="images/menuIA.png" alt="Logotipo" class="logo">
  </header>
  <div class="card">
    <h1>¡Mi sitio ya funciona!</h1>
    <p>Esta es mi primera página publicada con GitHub Pages.</p>
    <div class="actions">
      <button onclick="alert('¡Todo funciona correctamente!')">
        Probar página
      </button>
      <button onclick="alert('¡Este es el segundo botón!')">
        Saludar
      </button>
    </div>
  </div>
</body>
</html>
